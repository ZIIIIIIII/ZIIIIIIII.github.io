<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设备信息 · 密闭门</title>
  <!-- 使用柔和的系统字体，干净简洁 -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f2f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      padding: 1.5rem;
    }

    /* 卡片容器 – 模仿截图中的白底卡片 + 轻微阴影 */
    .device-card {
      max-width: 860px;
      width: 100%;
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08), 0 4px 10px rgba(0, 0, 0, 0.02);
      padding: 2rem 2rem 2.2rem;
      transition: 0.2s;
    }

    /* 主标题 — 与截图风格一致，粗体深色 */
    .card-title {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #0b1a2f;
      border-bottom: 2px solid #e6edf4;
      padding-bottom: 0.75rem;
      margin-bottom: 1.8rem;
      display: flex;
      align-items: center;
    }
    .card-title small {
      font-size: 1rem;
      font-weight: 400;
      color: #5e6f8d;
      margin-left: 0.75rem;
      background: #eef2f7;
      padding: 0.1rem 0.9rem;
      border-radius: 30px;
      letter-spacing: 0.3px;
    }

    /* 每个信息区块 */
    .info-block {
      margin-bottom: 2.2rem;
    }

    .block-header {
      display: flex;
      align-items: baseline;
      margin-bottom: 1rem;
      border-left: 4px solid #1e4f8a;
      padding-left: 0.9rem;
    }
    .block-header h2 {
      font-size: 1.3rem;
      font-weight: 600;
      color: #1a2c48;
      letter-spacing: 0.3px;
    }
    .block-header .sub-tag {
      font-size: 0.75rem;
      font-weight: 400;
      color: #5f7a9a;
      background: #eef3f9;
      padding: 0.1rem 0.8rem;
      border-radius: 20px;
      margin-left: 0.8rem;
    }

    /* 信息网格 – 两列布局，仿截图样式 */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem 1.8rem;
      background: #f9fbfd;
      padding: 1.2rem 1.6rem;
      border-radius: 16px;
      border: 1px solid #e9eef3;
    }

    .info-item {
      display: flex;
      align-items: baseline;
      padding: 0.3rem 0;
      border-bottom: 1px dashed #e1e8f0;
    }
    .info-item:last-child {
      border-bottom: none;
    }
    /* 针对特殊长内容，占两列 */
    .info-item.full-width {
      grid-column: 1 / -1;
    }

    .info-label {
      font-weight: 500;
      color: #2b405b;
      min-width: 110px;
      font-size: 0.9rem;
      letter-spacing: 0.2px;
      flex-shrink: 0;
    }
    .info-value {
      color: #0b1f33;
      font-weight: 500;
      font-size: 0.95rem;
      word-break: break-word;
      padding-left: 0.2rem;
    }
    .info-value.light {
      font-weight: 400;
      color: #1f3a57;
    }
    .info-value .muted {
      color: #5b6f89;
      font-weight: 400;
    }

    /* 特殊处理 “材质” 字段 – 截图中材质显示为 800*2200，与接口尺寸相同，但保留字段 */
    .info-value .dimension-tag {
      background: #e6edf6;
      padding: 0.1rem 0.7rem;
      border-radius: 24px;
      font-size: 0.85rem;
      color: #1b3a62;
    }

    /* 生产信息区块 – 与基本信息风格统一 */
    .production-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem 1.8rem;
      background: #f9fbfd;
      padding: 1.2rem 1.6rem;
      border-radius: 16px;
      border: 1px solid #e9eef3;
    }
    .production-item {
      display: flex;
      align-items: baseline;
      padding: 0.3rem 0;
      border-bottom: 1px dashed #e1e8f0;
    }
    .production-item:last-child {
      border-bottom: none;
    }
    .production-item.full-width {
      grid-column: 1 / -1;
    }
    .production-label {
      font-weight: 500;
      color: #2b405b;
      min-width: 110px;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .production-value {
      color: #0b1f33;
      font-weight: 500;
      font-size: 0.95rem;
      word-break: break-word;
      padding-left: 0.2rem;
    }
    .production-value .code {
      font-family: 'SF Mono', 'Menlo', monospace;
      background: #eef3f9;
      padding: 0.1rem 0.6rem;
      border-radius: 12px;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
    }

    /* 统一调整行间距 */
    .info-item, .production-item {
      line-height: 1.5;
    }

    /* 对特别长的字段（如单位名称）优化 */
    .info-value.break-all, .production-value.break-all {
      word-break: break-word;
    }

    /* 仿截图中的小提示 / 研发单位后 “...” 用省略号表示，但不影响布局 */
    .ellipsis-hint {
      color: #5f7a9a;
      font-weight: 300;
      letter-spacing: 0.2px;
    }

    /* 让两个区块之间有明显间隔 */
    .info-block + .info-block {
      margin-top: 0.5rem;
    }

    /* 移动端适配：在小屏幕上改为单列 */
    @media (max-width: 640px) {
      .device-card {
        padding: 1.5rem 1rem;
      }
      .info-grid, .production-grid {
        grid-template-columns: 1fr;
        gap: 0.2rem;
        padding: 1rem 1rem;
      }
      .info-item, .production-item {
        border-bottom: 1px solid #e9edf3;
        padding: 0.5rem 0;
        flex-wrap: wrap;
      }
      .info-item:last-child, .production-item:last-child {
        border-bottom: none;
      }
      .info-label, .production-label {
        min-width: 100px;
      }
      .block-header h2 {
        font-size: 1.1rem;
      }
      .card-title {
        font-size: 1.4rem;
      }
    }

    /* 小细节：统一去除默认外框 */
    .device-card *:focus {
      outline: none;
    }

    /* 辅助显示 “研发单位” 后的省略号 */
    .research-extra {
      color: #637e9e;
      font-weight: 300;
      margin-left: 2px;
    }
  </style>
</head>
<body>
  <div class="device-card">
    <!-- 主标题：设备基本信息 + 小标签 (仿截图) -->
    <div class="card-title">
      设备基本信息
      <small>密闭门 · 无门槛单扇</small>
    </div>

    <!-- ===== 基本信息区块 ===== -->
    <div class="info-block">
      <div class="block-header">
        <h2>设备基本信息2</h2>
        <span class="sub-tag">产品参数</span>
      </div>
      <div class="info-grid">
        <!-- 产品类型/名称 -->
        <div class="info-item full-width">
          <span class="info-label">产品类型/名称</span>
          <span class="info-value">密闭门-无门槛单扇密闭门</span>
        </div>
        <!-- 型号编码 -->
        <div class="info-item">
          <span class="info-label">型号编码</span>
          <span class="info-value">WDMM0822-P-S</span>
        </div>
        <!-- 接口尺寸/mm -->
        <div class="info-item">
          <span class="info-label">接口尺寸/mm</span>
          <span class="info-value">800*2200</span>
        </div>
        <!-- 材质 – 注意截图里材质显示为 800*2200，保持相同 -->
        <div class="info-item">
          <span class="info-label">材质</span>
          <span class="info-value"><span class="dimension-tag">800*2200</span></span>
        </div>
        <!-- 研发单位 – 加上了 "..." 以模仿截图中的省略号 -->
        <div class="info-item full-width">
          <span class="info-label">研发单位</span>
          <span class="info-value break-all">
            湖北军科人防工程科技有限公司
            <span class="research-extra">, ...</span>
          </span>
        </div>
      </div>
    </div>

    <!-- ===== 生产信息区块 ===== -->
    <div class="info-block">
      <div class="block-header">
        <h2>设备生产信息</h2>
        <span class="sub-tag">制造溯源</span>
      </div>
      <div class="production-grid">
        <!-- 生产单位 -->
        <div class="production-item full-width">
          <span class="production-label">生产单位</span>
          <span class="production-value">广西南宁人防防护设备有限责任公司</span>
        </div>
        <!-- 统一社会信用代码 -->
        <div class="production-item full-width">
          <span class="production-label">统一社会信用代码</span>
          <span class="production-value"><span class="code">914501007399722629</span></span>
        </div>
        <!-- 生产时间 -->
        <div class="production-item">
          <span class="production-label">生产时间</span>
          <span class="production-value">2026年08月</span>
        </div>
        <!-- 生产地址 -->
        <div class="production-item">
          <span class="production-label">生产地址</span>
          <span class="production-value">南宁市兴宁区五塘镇强镇路3号</span>
        </div>
        <!-- 生产批次 -->
        <div class="production-item full-width">
          <span class="production-label">生产批次</span>
          <span class="production-value"><span class="code">20260806143206315</span></span>
        </div>
      </div>
    </div>

    <!-- 额外的装饰性脚注 – 纯粹为了视觉平衡，模仿截图底部的留白感 -->
    <div style="margin-top: 1.4rem; border-top: 1px solid #eef3f8; padding-top: 0.8rem; display: flex; justify-content: flex-end;">
      <span style="font-size: 0.7rem; color: #8a9bb0; letter-spacing: 0.3px;">信息更新于 2026-08 · 内部档案</span>
    </div>
  </div>
</body>
</html>
